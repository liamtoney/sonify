version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  jobs:
    # Ensure all tags are fetched after checkout
    post_checkout:
      - git fetch --unshallow --tags || git fetch --tags

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
