name: build
on:
  push:
    paths-ignore:
      - docs/**
      - scripts/**
      - LICENSE.txt
      - README.rst
      - .gitignore
      - .readthedocs.yml
jobs:
  install-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      UV_CACHE_DIR: .uv-cache/
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # uv-dynamic-versioning needs git history/tags
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Check formatting and linting
        run: uv run poe check
      - name: Run tests
        run: uv run poe tests --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
