[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "sonify"
dynamic = ["version"]
description = "Sonification of seismic and infrasound signals"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Liam Toney", email = "liam@liam.earth" },
]
maintainers = [
    { name = "Liam Toney", email = "liam@liam.earth" },
]
keywords = ["seismology", "infrasound", "sonification", "spectrogram", "obspy"]
classifiers = [
    'Intended Audience :: Education',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Visualization',
    'Programming Language :: Python :: 3',
]
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg",
    "matplotlib>=3.10.7,<3.11",
    "numpy",
    "obspy",
    "scipy",
    "tqdm",
]

[project.urls]
Documentation = "https://sonify.liam.earth/"
Source = "https://github.com/liamtoney/sonify"
Issues = "https://github.com/liamtoney/sonify/issues"

[dependency-groups]
tooling = ["poethepoet"]
lint = ["ruff"]
test = ["pytest", "pytest-cov", "pytest-mpl"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-copybutton"]

[project.scripts]
sonify = "sonify.sonify:main"

[tool.ruff.format]
quote-style = "single"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"

[tool.poe.env]
TARGET_FILES = "src/ tests/ scripts/ docs/"

[tool.poe.tasks]
docs = "sphinx-build docs/ docs/_build/ --fail-on-warning"
tests = "pytest"
_lint = "ruff check ${TARGET_FILES}"
_format = "ruff format ${TARGET_FILES}"
format = ["_lint --select I --fix", "_format"]
check = ["_lint", "_format --check"]
screenshot = "python scripts/create_screenshot.py"

[tool.pytest]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--mpl",
    "--cov=sonify",
    "--capture=no",
    "--cov-report=term-missing",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sonify"]
