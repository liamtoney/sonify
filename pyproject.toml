[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "sonify"
dynamic = ["version"]
authors = [
    { name = "Liam Toney", email = "ltoney@usgs.gov" },
]
maintainers = [
    { name = "Liam Toney", email = "ltoney@usgs.gov" },
]
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg",
    "matplotlib==3.10",
    "obspy",
    "tqdm",
]

[dependency-groups]
tooling = ["poethepoet"]
lint = ["ruff"]
test = ["pytest", "pytest-cov", "pytest-mpl"]
docs = [
    "sphinx",
    "recommonmark",
    "sphinx-rtd-theme",
]

[project.scripts]
sonify = "sonify.sonify:main"

[tool.ruff.format]
quote-style = "single"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.poe.env]
TARGET_FILES = "sonify/ tests/ doc/"

[tool.poe.tasks]
docs = "sphinx-build doc/ _build/ --fail-on-warning"
tests = "pytest"
_lint = "ruff check ${TARGET_FILES}"
_format = "ruff format ${TARGET_FILES}"
format = ["_lint --select I --fix", "_format"]
check = ["_lint", "_format --check"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--verbose", "--cov=sonify", "--cov-report=term-missing"]
